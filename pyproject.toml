[build-system]
requires = [
    "hatchling>=1.25.0",
    "hatch-vcs>=0.4.0",
]
build-backend = "hatchling.build"

[project]
name = "kanta"
dynamic = ["version"]
description = "Kanta No-SQL database for async Python and frameworks such as FastAPI and Sanic"
authors = [
    { name = "Leo Vasanko"},
]
keywords = ["kantadb"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "blake3>=1.0.8",
    "jsondiff>=2.2.1",
    "msgspec>=0.20.0",
]

[project.scripts]
kanta = "kanta.__main__:main"

[project.optional-dependencies]
bin = [
    "blake3>=1.0.8",
]

[project.urls]
Repository = "https://git.zi.fi/LeoVasanko/kanta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["kanta"]
